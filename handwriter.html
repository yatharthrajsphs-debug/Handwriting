<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yatharth Handwriting Studio</title>

    <!-- Handwriting font -->
    <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet" />

    <style>
        body {
            font-family: 'Shadows Into Light', cursive;
            background-color: #f5f5f5;
            padding: 40px;
            text-align: center;
        }

        textarea {
            width: 80%;
            height: 150px;
            font-family: 'Shadows Into Light', cursive;
            font-size: 24px;
            padding: 10px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            resize: none;
        }

        button {
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #333;
            color: #fff;
        }

        button:hover {
            background-color: #555;
        }

        #output {
            white-space: pre-wrap;
            margin-top: 20px;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 8px #ccc;
            font-size: 24px;
            min-height: 150px;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body>

    <h1>Yatharth’s Handwriting Generator</h1>

    <textarea id="inputText" placeholder="Type your text here..."></textarea>

    <div>
        <button onclick="writeHandwriting()">Generate Handwriting</button>
    </div>

    <div id="output"></div>

    <script>
        function writeHandwriting() {
            const input = document.getElementById('inputText').value;
            const output = document.getElementById('output');
            output.textContent = input;
        }
    </script>

</body>
</html>
